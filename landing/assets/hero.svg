<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="300" viewBox="0 0 1200 300"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">TokenUse — 实时监测 ZCode / Codex CLI 的 token 消耗与等效金额</title>
  <desc id="hero-desc">TokenUse 标题横幅：项目名、一句话价值（把 AI 编程工具烧掉的 token 和等效金额实时摊在桌面上），右侧为产品图标中的金色油表环。</desc>

  <defs>
    <radialGradient id="glow-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4941e" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#c4941e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d14e66" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#d14e66" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gauge-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#e09422"/>
    </linearGradient>
    <clipPath id="gauge-disc">
      <circle cx="0" cy="0" r="46"/>
    </clipPath>
  </defs>

  <!-- 画布底色：暖金奶油（与 v0.3.0 亮色主题一致） -->
  <rect width="1200" height="300" rx="26" fill="#f1ede5"/>
  <circle cx="1020" cy="30" r="330" fill="url(#glow-gold)"/>
  <circle cx="120" cy="-20" r="300" fill="url(#glow-rose)"/>

  <!-- 左侧标题块 -->
  <g id="title-block" transform="translate(64 0)">
    <!-- 状态行：LIVE + 数据源（与仪表盘页眉一致） -->
    <g transform="translate(0 82)">
      <circle cx="6" cy="0" r="6" fill="#16a34a"/>
      <circle cx="6" cy="0" r="11" fill="none" stroke="#16a34a" stroke-width="1.5" opacity=".35"/>
      <text x="26" y="6" font-family="Consolas, ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="18" fill="#a39e94" letter-spacing="2">LIVE — ZCode ✓ · Codex ✓</text>
    </g>

    <!-- 项目名 -->
    <text x="-2" y="160" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="78" font-weight="800" letter-spacing="-1">
      <tspan fill="#1b1917">Token</tspan><tspan fill="#b07f0a">Use</tspan>
    </text>

    <!-- 一句话价值 -->
    <text x="0" y="204" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="22" fill="#57534c">把 ZCode / Codex 烧掉的 token 和等效金额，实时摊在你的桌面上</text>

    <!-- 元信息 chips -->
    <g transform="translate(0 236)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#57534c">
      <rect x="0" y="0" width="123" height="30" rx="15" fill="#f9f7f2" stroke="#ddd6c7"/>
      <text x="61.5" y="20" text-anchor="middle">Windows 10+</text>
      <rect x="135" y="0" width="98" height="30" rx="15" fill="#f9f7f2" stroke="#ddd6c7"/>
      <text x="184" y="20" text-anchor="middle">Electron</text>
      <rect x="245" y="0" width="124" height="30" rx="15" fill="#f9f7f2" stroke="#ddd6c7"/>
      <text x="307" y="20" text-anchor="middle" fill="#b07f0a">数据不出本机</text>
      <rect x="381" y="0" width="196" height="30" rx="15" fill="#f9f7f2" stroke="#ddd6c7"/>
      <text x="479" y="20" text-anchor="middle">托盘 · 悬浮图标 · 仪表盘</text>
    </g>
  </g>

  <!-- 右侧油表环：应用图标母题（暖金配色） -->
  <g id="gauge-motif" transform="translate(1010 150)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f0b429" stroke-width="1.5" opacity=".35"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#f0b429" stroke-width="1" opacity=".15"/>
    <rect x="-95" y="-95" width="190" height="190" rx="44" fill="#f9f7f2" stroke="#ddd6c7"/>
    <circle cx="0" cy="0" r="60" fill="#161310" stroke="#f0b429" stroke-width="13"/>
    <g clip-path="url(#gauge-disc)">
      <rect x="-46" y="4" width="92" height="42" fill="url(#gauge-fill)"/>
    </g>
    <rect x="-24" y="-24" width="48" height="13" rx="2.5" fill="#f9f7f2"/>
  </g>
</svg>
